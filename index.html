<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Login</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <h1>Iniciar sesión</h1>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input id="email" type="email" placeholder="tucorreo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" placeholder="Tu contraseña" required minlength="6">
                </div>
                <div id="message" role="status"></div>
                <button type="submit">Entrar</button>
            </form>
            <div class="footer-note"><small class="hint">Proyecto de ejemplo — sin autenticación real</small></div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
